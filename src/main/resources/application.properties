spring.application.name=bodega-api

# Configuración de la Base de Datos (leyendo variables de entorno o usando local por defecto)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bodega_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Puerto dinámico requerido por Render (por defecto 8080 para desarrollo local)
server.port=${PORT:8080}

# SQL y Logs
spring.sql.init.mode=always
spring.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false