spring.application.name=bodega-api

# Configuración dinámica usando variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bodega_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:tu_contraseña}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Puerto dinámico para Render (por defecto 8080 para desarrollo local)
server.port=${PORT:8080}

spring.sql.init.mode=always
spring.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false