spring.application.name=bodega-api

# Configuración de Base de Datos mediante variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA y Hibernate (evitamos que altere o valide esquemas a la fuerza si hay problemas)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Puerto dinámico obligatorio para Render
server.port=${PORT:8080}

# Desactivamos la ejecución de scripts automáticos que causan el fallo en el arranque
spring.sql.init.mode=never

# Logs de SQL para depuración
spring.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway desactivado
spring.flyway.enabled=false