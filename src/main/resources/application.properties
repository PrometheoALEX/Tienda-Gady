spring.application.name=bodega-api

# Configuración de Base de Datos mediante variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA y Hibernate (crea/actualiza las tablas automáticamente)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Puerto dinámico obligatorio para Render
server.port=${PORT:8080}

# Inicialización segura de scripts (Permite correr data.sql pero continúa si hay errores para no tumbar el servidor)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Logs de SQL para depuración
spring.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway desactivado
spring.flyway.enabled=false