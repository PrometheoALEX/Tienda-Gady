spring.application.name=bodega-api

# Datos de conexion a PostgreSQL vinculados a las variables de entorno del .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# MODO SEGURO: 'update' actualiza esquemas sin borrar tus datos reales de la base de datos
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=always
spring.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar Flyway
spring.flyway.enabled=false