version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bodega_db
    environment:
      POSTGRES_DB: bodega_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: .
    container_name: bodega_backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/bodega_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=123456
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: